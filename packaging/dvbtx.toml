# dvbtx - reference configuration (every key shown with its default value, commented out when optional).
# Units: frequencies and rates in Hz / bit/s (480_000_000, "482MHz" and 482e6 are all accepted).
# Any key can also be overridden on the command line:  dvbtx -s radio.0.gain=40 -s carrier.0.frequency=490MHz
# Check a file without transmitting:                    dvbtx check -c /etc/dvbtx/dvbtx.toml

work_dir = "/run/dvbtx"                 # engine.ini and the SI tables (tmpfs)

[network]
name = "dvbtx"                          # network_name_descriptor (NIT), shown by some TVs
network_id = 0x20FA                     # NIT network_id
onid = 0x20FA                           # original_network_id: 0x20FA = France. Many TVs ignore the logical
                                        # channel numbers (LCN) of an ONID that does not match their country.
provider = "dvbtx"                      # default service provider name (SDT)
country = "FRA"                         # TOT local time offset country (ISO 3166 alpha-3)
timezone = "Europe/Paris"               # TOT and XMLTV times without offset
charset = "iso8859-9"                   # DVB text: iso8859-9 (0x05 prefix, as the French DTT: accents shown by
                                        # the TVs), iso8859-15, iso8859-1, iso6937 (no prefix), utf8
lcn_pds = 0x28                          # private_data_specifier before the LCN descriptor (0x28 EACEM, like TNT); 0 = none
frequency_in_nit = true                 # false: centre_frequency 0xFFFFFFFF in the NIT, as the French TNT does
sdt_other = false                       # also send SDT other (services of the other multiplexes)
nit_period_ms = 2000
sdt_period_ms = 1000

[epg]
dir = "/var/lib/dvbtx/epg"              # every XMLTV (*.xml, *.xml.gz) or TSDuck EIT XML file dropped here is loaded,
                                        # re-read when it changes (an external service can write it)
urls = []                               # XMLTV URLs fetched every url_refresh_s, e.g. ["http://tunarr:8000/api/xmltv.xml"]
url_refresh_s = 3600
days = 7                                # EIT schedule depth
schedule = true                         # EIT schedule (guide); p/f (now/next) is always sent
pf_cycle_ms = 1000
schedule_cycle_ms = 10000

[web]
enabled = true
listen = "127.0.0.1:8080"               # monitoring page; "0.0.0.0:8080" for the LAN (then set a token)
token = ""                              # if set, changes (channels, restarts) need "Authorization: Bearer <token>"
allow_exec_sources = false              # let the web API / dvbtx channel set exec:, pipe:, stdin: sources
preview_max_live = 4                    # live channel previews at once on the web page (thumbnails: one ffmpeg per multiplex)
preview_thumbnails = true               # pictures of the channels shown on the page by default (the eye of the
                                        # "Aperçu" column hides them; one ffmpeg per multiplex while the page is open)
preview_thumb_every_s = 60              # a new picture per channel every ... s: each one reads the multiplex a few
                                        # seconds, so the CPU it takes is about proportional to 1 / this

[monitoring]
tsduck = "auto"                         # run "tsp -P analyze" on each multiplex: true, false, auto (if tsp exists)
interval = 5                            # seconds between TSDuck reports
export = []                             # send each TSDuck JSON report to ["udp://10.0.0.5:5000", "tcp://host:port"]
stats_export = []                       # send the engine statistics + active alerts (JSON, every second)
tsp = "tsp"

[alerts]
margin_min_ms = 150                     # warn when the decoding margin of a service drops below this
overload_percent = 98.0                 # warn when a multiplex is this full
late_ms = 300                           # warn when packets leave this late (the margin usually absorbs it)
input_down_s = 10                       # warn when a running source has sent nothing for this long (0: never)
webhook = ""                            # POST every alert (JSON) to this URL
command = ""                            # or run this command (env DVBTX_ALERT_EVENT/LEVEL/KEY/MESSAGE)
repeat_s = 300
hold_s = 4                              # a condition must last this long to raise an alert

[ingest]
base_port = 20100                       # local UDP ports of the ingest processes: base_port + input number
monitor_base_port = 20900               # copy of each multiplex: udp://127.0.0.1:(monitor_base_port + carrier)
ffmpeg = "ffmpeg"
streamlink = "streamlink"
ytdlp = "yt-dlp"
loglevel = "warning"
restart_min_s = 1
restart_max_s = 30
stall_restart_s = 20                    # an ffmpeg that sends nothing for this long is restarted
discontinuity_restart = 10              # an ffmpeg reporting this many timestamp discontinuities within 30 s is
                                        # replaced by a new one, beside it, without a cut (0: never)
gpu = "auto"                            # transcodes on the GPU that works best (learnt), else the CPU; "off": CPU only;
                                        # or a list of cards: "/dev/dri/renderD128,cuda:0" (dvbtx gpu lists them)
gpu_cache = ""                          # learnt results; "" = /var/lib/dvbtx/gpu.json

[engine]
binary = ""                             # default: /usr/lib/dvbtx/dvbtx-engine
log_level = "info"
stats_interval_ms = 1000
cpus = "auto"                           # auto: every engine thread kept off the cores that take the USB
                                        # interrupts (a real-time thread there delays the USB work: gaps on
                                        # air); "all", or a list such as "1-5"
cpu_latency_us = 0                      # processor wake-up latency allowed while transmitting (/dev/cpu_dma_latency):
                                        # deep C-states delay the USB DMA and empty the radio's FIFO (-1: no request);
                                        # 100 saves power when the processor is busy, but a HackRF with the
                                        # processor mostly idle had ~150 gaps/s with it: measure before changing.
                                        # "auto": starts at 0, one idle state more after each cpu_latency_step_s
                                        # without gap on air, back to the last good step at the first gap
                                        # (and twice as long before trying again)
# cpu_latency_max_us = 100              # with "auto": the highest latency tried
# cpu_latency_step_s = 30               # with "auto": seconds without gap before the next step

# Power profiles of the whole machine (dvbtx power, dvbtx-power(8)): only once enabled with
# "systemctl enable --now dvbtx-power"; save while nothing is on air, transmit while dvbtx runs
[power]
save_epp = "power"                      # processor energy/performance preference: performance,
transmit_epp = "balance_power"          # balance_performance, balance_power, power
save_turbo = false                      # turbo / boost allowed
transmit_turbo = true
save_aspm = "powersupersave"            # PCIe link power: default (firmware), performance, powersave,
transmit_aspm = "default"               # powersupersave (refused when the firmware keeps it)
save_command = ""                       # shell command run after the profile (a backlight, a fan...)
transmit_command = ""

# Defaults of every service (each key can be set per service too)
[defaults]
backup = "/var/lib/dvbtx/backup.ts"     # played when the source stops (default "": none); the package creates
                                        # this one (dvbtx make-backup)
buffer_ms = "auto"                      # de-jitter buffer between arrival and transmission (ms); auto: 6000 for
                                        # live sources sent in segments (YouTube, Twitch, *.m3u8: at the live edge
                                        # of the playlist they arrive in bursts, one per segment), 1000 otherwise
ring_pkts = "auto"                      # packets held per input (auto: the buffer + 4 s at 15 Mbit/s)
switch_timeout_ms = 3000                # silence before switching to the backup (once the buffer has played out)
failover_s = 10                         # several sources: the next one when the one playing has delivered
                                        # nothing for this long
source_start_s = 30                     # ... or has not started within this time
preferred_retry_s = 300                 # not on the first source: the preferred ones tried this often (0: never);
                                        # a source left is tried twice later each time (up to 1 h)
unstable_switches = 3                   # a source is also left when its channel fell to the backup this many times
unstable_window_s = 600                 # ... within this time (0 switches: never)
return_ms = 10000                       # primary stable for this long before switching back
max_late_ms = 600                       # packets later than this are dropped
early_ms = 100                          # packets may leave this much in advance to smooth the peaks
priority = 5                            # 1-10: when a multiplex is overloaded, higher priorities are served first
bitrate_weight = 1                      # share of the bit rate of a re-encoded channel (video_bitrate = "auto"):
                                        # what the copied channels leave is split by weight (SD 1, HD 2, Full HD 3,
                                        # 4K 6); a copied channel keeps its source's rate whatever its weight
max_bitrate = ""                        # at most this for a re-encoded channel ("" = encode.max_auto_bitrate)
                                        # and the lower ones get the delays (then the losses)
pcr_max_ms = 35                         # a PCR is inserted if the source leaves a longer gap
mux_delay = 0.7                         # ffmpeg -muxdelay: decoding margin given to the receiver (s)
readrate = "auto"                       # pace the reading at real time (-re): auto = every source that is not
                                        # live by nature (files, HTTP/HLS, playlists, exec:, streamlink...)
hls = "auto"                            # HLS URLs: "auto" = through streamlink when installed (ffmpeg's HLS
                                        # reader stalls at ads and episode changes), "ffmpeg", "streamlink"
loop = true                             # loop files and folders
map = ["0:v:0?", "0:a?"]                # streams kept: first video, every audio track
copy_audio_codecs = ["aac", "mp2", "mp3", "ac3", "eac3", "aac_latm"]   # audio copied as is; others are encoded (a TV
                                        # without E-AC-3: remove "eac3" and the 5.1 tracks become AAC stereo)
codec_check = true                      # copied files/HTTP/playlists: ffprobe first; video not in H.264/HEVC/MPEG-2
                                        # (VP9, AV1...) is encoded, audio not in AAC/MP2/AC-3/E-AC-3 (Opus...) too
# ytdlp_format = "bv*[vcodec^=avc1][height<=1080]+ba[acodec^=mp4a]/b[vcodec^=avc1]/bv*[height<=1080]+ba/b"
                                        # yt-dlp format selection
# ffmpeg_input = ["-extension_picky", "0"]   # extra ffmpeg input options
# ffmpeg_output = []                         # extra ffmpeg output options

[defaults.encode]                       # used when a service has encode = true or a capture source
video_codec = "libx264"                 # libx264, libx265, mpeg2video, h264_vaapi, h264_nvenc, ...
preset = "veryfast"
video_bitrate = "auto"                  # "auto": share of the multiplex left by the other services,
max_auto_bitrate = "8M"                 #   at most this
gop_s = 1.0
audio_codec = "aac"                     # aac, mp2, ac3, eac3
audio_bitrate = "128k"
audio_rate = 48000
pix_fmt = "yuv420p"
size = ""                               # e.g. "1280x720" (scaled, black bars kept)
fps = ""
hwaccel = ""                            # "" / "auto": a GPU if one works (ingest.gpu); "cpu": never;
                                        # "vaapi", "qsv", "nvenc": only that kind
deinterlace = false

# --------------------------------------------------------------------------- radios
# As many as wanted. Each radio carries the carriers that name it, placed on one OFDM synthesis:
# their centre frequency and sample rate are computed (or forced with center / rate).
[[radio]]
name = "hackrf"
driver = "hackrf"                       # hackrf, uhd (USRP B200/B210...), soapy (LimeSDR, Pluto...), null (no radio)
args = ""                               # hackrf: "serial=...", "rt=60" (SCHED_FIFO priority of its USB thread,
                                        # default 60, 0: none), "m0_poll=1" (s between reads of its gap counter),
                                        # "cb_log_ms=12" (diagnosis: log USB callbacks later than that, and each gap);
                                        # uhd: "serial=...,type=b200"; soapy: "driver=lime"
gain = 30                               # hackrf: TX VGA 0-47 dB; uhd: 0-89.75 dB
amp = false                             # hackrf +14 dB amplifier
ppm = 0.0                               # oscillator correction
# center = 0                            # LO frequency (0 = automatic: between the carriers, or below a single one)
# rate = 0                              # sample rate (0 = automatic)
# bandwidth = 0                         # analog filter (0 = automatic)
backoff_db = 13.0                       # RMS level below full scale (OFDM peaks)
buffer_ms = 50

# --------------------------------------------------------------------------- multiplexes
# As many as wanted, each with as many services as its capacity allows (dvbtx calc dvbt --table).
[[carrier]]
name = "Mux 1"
radio = "hackrf"
standard = "dvbt"                       # dvbt; ts (no radio: the multiplex goes to 'output' for an external modulator)
frequency = 482_000_000                 # or channel = 22 (UHF 21-69, VHF 5-12)
bandwidth = 8_000_000                   # 5, 6, 7, 8 MHz
mode = "8k"                             # 2k, 8k
constellation = "64qam"                 # qpsk, 16qam, 64qam
code_rate = "7/8"                       # 1/2 2/3 3/4 5/6 7/8
guard = "1/32"                          # 1/4 1/8 1/16 1/32  -> 31.67 Mbit/s with these values
tsid = 1                                # transport_stream_id (default: carrier number + 1)
cell_id = 0
# monitor = ["udp://239.1.1.1:1234"]    # extra copies of the multiplex (watch it with VLC)

  [[carrier.service]]
  name = "Mire"                         # service name (SDT)
  lcn = 1                               # logical channel number (default: next free one)
  source = "lavfi:testsrc2=size=1280x720:rate=25"
  # sid = 0x0101                        # service_id (default: tsid << 8 | number)
  # provider = "..."
  # type = "auto"                       # auto (from the streams), hd, sd, hevc, radio or a number
  # epg_id = "TF1.fr"                   # XMLTV channel id (default: matched by name)
  # backup = "/path/to/other.ts"        # or false
  # encode = true                       # or a table of [defaults.encode] keys: { video_bitrate = "4M" }

#  [[carrier.service]]
#  name = "Film"
#  source = "/srv/videos/film.mkv"      # see 'man dvbtx' / README for every kind of source

#  [[carrier.service]]
#  name = "Info"
#  source = ["http://provider.example/u/p/289",   # several sources, in order of preference: the next one
#            "http://provider.example/u/p/319",   # when the one playing fails, back to a preferred one when
#            "http://other.example/info.m3u8"]    # it works again; none works: the backup clip
#  buffer_ms = 8000                     # cache of this channel (ms), instead of auto

# A satellite multiplex for the satellite input of a TV (closed coax, through a DC block: the TV puts
# 13/18 V on its cable). frequency is the one entered on the TV; the L-band IF sent (here 1200 MHz)
# is computed with the LNB the TV is set for. Its radio must cover that band (not the one of a DVB-T
# carrier): a [[radio]] of its own.
# [[carrier]]
# name = "Sat"
# radio = "sat"
# standard = "dvbs2"                    # or "dvbs" (QPSK, code_rate 1/2 2/3 3/4 5/6 7/8)
# frequency = 10_950_000_000            # entered on the TV; below 9.5 GHz: the IF itself
# lnb_lo = "universal"                  # 9750 MHz below 11700 MHz, 10600 above; or Hz (single LNB)
# symbol_rate = 15_500_000              # HackRF: 15.5 Msym/s at most (lo_offset = 0 on its radio)
# modulation = "8psk"                   # qpsk 8psk 16apsk 32apsk (TVs: qpsk and 8psk at least)
# code_rate = "9/10"                    # -> 40.59 Mbit/s with these values
# rolloff = 0.2                         # 0.35 0.25 0.2
# polarization = "h"                    # in the NIT
#   [[carrier.service]]
#   name = "Sat 1"
#   source = "lavfi:testsrc2"
